<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>URL Shortener</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>URL Shortener</h1>
      <p class="subtitle">Create short links, manage them, and watch them expire.</p>
      <span id="status" class="status" aria-live="polite"></span>
    </header>

    <section class="card">
      <form id="shorten-form" class="row">
        <input
          id="url-input"
          type="url"
          placeholder="https://example.com/very/long/path"
          required
          autocomplete="off"
        />
        <input
          id="ttl-input"
          type="number"
          min="1"
          placeholder="TTL (sec, optional)"
          class="ttl"
        />
        <button type="submit">Shorten</button>
      </form>
      <div id="result" class="result" hidden></div>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Your links</h2>
        <button id="refresh-btn" class="ghost" type="button">Refresh</button>
      </div>
      <div id="links" class="links">
        <p class="empty">Loading…</p>
      </div>
    </section>
  </div>

  <template id="link-template">
    <div class="link">
      <div class="link-main">
        <a class="short" target="_blank" rel="noopener"></a>
        <span class="long"></span>
        <span class="meta"></span>
      </div>
      <div class="link-actions">
        <button class="copy ghost" type="button">Copy</button>
        <button class="delete ghost danger" type="button">Delete</button>
      </div>
    </div>
  </template>

  <script src="/app.js" defer></script>
</body>
</html>
